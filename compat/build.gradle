plugins { id 'com.android.application' }
android {
    namespace 'au.steve.hyperlauncher.compat'
    compileSdk 35
    defaultConfig {
        applicationId 'au.steve.hyperlauncher.compat'
        minSdk 28
        targetSdk 35
        versionCode 29
        versionName '1.6.0-keyguard'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        release {
            if (System.getenv('AURORA_KEYSTORE_PATH')) {
                storeFile file(System.getenv('AURORA_KEYSTORE_PATH'))
                storePassword System.getenv('AURORA_STORE_PASSWORD')
                keyAlias System.getenv('AURORA_KEY_ALIAS')
                keyPassword System.getenv('AURORA_KEY_PASSWORD')
            }
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all { systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2' }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        noCompress 'tflite'
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
dependencies {
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    // Xposed API signatures only; LSPosed/Vector supplies the real classes inside System UI.
    compileOnly project(':xposed-stub')
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
}
