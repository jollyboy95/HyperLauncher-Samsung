plugins { id 'com.android.application' }
android {
    namespace 'au.steve.hyperlauncher.compat'
    compileSdk 35
    defaultConfig {
        applicationId 'au.steve.hyperlauncher.compat'
        minSdk 28
        targetSdk 35
        versionCode 14
        versionName '0.9.3-preview'
    }
    signingConfigs {
        release {
            if (System.getenv('AURORA_KEYSTORE_PATH')) {
                storeFile file(System.getenv('AURORA_KEYSTORE_PATH'))
                storePassword System.getenv('AURORA_STORE_PASSWORD')
                keyAlias System.getenv('AURORA_KEY_ALIAS')
                keyPassword System.getenv('AURORA_KEY_PASSWORD')
            }
        }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
