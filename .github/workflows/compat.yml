name: Build Aurora Depth preview
on:
  push:
    branches: [main, feature/aurora-lockscreen]
    paths: ['compat/**', '*.gradle', 'gradle.properties', '.github/workflows/compat.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing one or more Aurora signing secrets"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aurora-release.jks"
          echo "AURORA_KEYSTORE_PATH=$RUNNER_TEMP/aurora-release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/aurora-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Test, lint and build
        env:
          AURORA_STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
        run: gradle --no-daemon :compat:testDebugUnitTest :compat:lintDebug :compat:assembleRelease
      - name: Name signed APK for download
        run: |
          set -euo pipefail
          CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' compat/build.gradle | head -1)
          NAME=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" compat/build.gradle | head -1)
          mkdir -p dist
          cp compat/build/outputs/apk/release/*.apk "dist/AuroraDepth-v${CODE}-${NAME}-signed.apk"
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraDepth-signed-release
          path: dist/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            compat/build/reports/
