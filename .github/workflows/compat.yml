name: Build compatibility prototype
on:
  push:
    paths: ['compat/**', '*.gradle', 'gradle.properties', '.github/workflows/compat.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: gradle --no-daemon :compat:testDebugUnitTest :compat:lintDebug :compat:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HyperLauncher-compatibility-debug
          path: compat/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            compat/build/reports/
