name: Build Aurora Depth preview
on:
  push:
    branches: [main, feature/aurora-lockscreen]
    paths: ['compat/**', 'xposed-stub/**', '*.gradle', 'gradle.properties', '.github/workflows/compat.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.AURORA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing one or more Aurora signing secrets"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/aurora-release.jks"
          echo "AURORA_KEYSTORE_PATH=$RUNNER_TEMP/aurora-release.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/aurora-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
      - name: Test, lint and build
        env:
          AURORA_STORE_PASSWORD: ${{ secrets.AURORA_STORE_PASSWORD }}
          AURORA_KEY_PASSWORD: ${{ secrets.AURORA_KEY_PASSWORD }}
          AURORA_KEY_ALIAS: ${{ secrets.AURORA_KEY_ALIAS }}
        run: gradle --no-daemon :compat:testDebugUnitTest :compat:lintDebug :compat:assembleRelease
      - name: Name signed APK for download
        run: |
          set -euo pipefail
          CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' compat/build.gradle | head -1)
          NAME=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" compat/build.gradle | head -1)
          mkdir -p dist
          cp compat/build/outputs/apk/release/*.apk "dist/AuroraDepth-v${CODE}-${NAME}-signed.apk"
          ls -lh dist
      - name: Verify System UI module packaging
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls compat/build/outputs/apk/release/*.apk | head -1)
          BT="$ANDROID_HOME/build-tools/35.0.0"
          unzip -p "$APK" assets/xposed_init | grep -qx 'au.steve.hyperlauncher.compat.aurora.system.KeyguardHook'
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          for m in xposedmodule xposedscope xposedminversion; do grep -q "\"$m\"" manifest.txt; done
          grep -q 'ModuleBridgeProvider' manifest.txt
          "$BT/aapt2" dump resources "$APK" | grep -q 'array/xposed_scope'
          for d in $(unzip -Z1 "$APK" | grep '^classes.*\.dex$'); do unzip -p "$APK" "$d" > "$RUNNER_TEMP/$d"; done
          "$BT/dexdump" "$RUNNER_TEMP"/classes*.dex | grep 'Class descriptor' > classes.txt
          grep -q "Lau/steve/hyperlauncher/compat/aurora/system/KeyguardHook;" classes.txt
          if grep -q "Lde/robv/android/xposed/" classes.txt; then echo "::error::Xposed API stub was packaged"; exit 1; fi
          "$BT/apksigner" verify --print-certs "$APK" | grep -E 'Signer #1 certificate (DN|SHA-256)'
          echo "Module packaging verified"
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraDepth-signed-release
          path: dist/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            compat/build/reports/
      - name: Publish signed release for a new versionCode
        if: github.event_name == 'push' && (github.ref_name == 'feature/aurora-lockscreen' || github.ref_name == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' compat/build.gradle | head -1)
          TAG="aurora-v$CODE"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already published"; exit 0; fi
          cp compat/build/outputs/apk/release/*.apk "AuroraDepth-v$CODE-signed.apk"
          sha256sum "AuroraDepth-v$CODE-signed.apk" > SHA256SUMS.txt
          git log -1 --format='%B' | sed '/^Co-Authored-By:/d;/^Claude-Session:/d' > RELEASE_NOTES.md
          printf '\n---\nSigned with the permanent Aurora Depth key. Android asks you to confirm the install; settings are kept.\n' >> RELEASE_NOTES.md
          gh release create "$TAG" "AuroraDepth-v$CODE-signed.apk" SHA256SUMS.txt \
            --title "Aurora Depth $TAG" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
