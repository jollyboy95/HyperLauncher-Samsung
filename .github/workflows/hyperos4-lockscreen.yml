name: HyperOS 4 lock screen build

on:
  push:
    branches: [feature/hyperos4-lockscreen]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyperos4-lockscreen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests
        run: gradle --no-daemon --console=plain :compat:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon --console=plain :compat:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS4-lockscreen-debug-apk
          path: compat/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS4-lockscreen-test-reports
          path: |
            compat/build/reports/tests/testDebugUnitTest/
            compat/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
